<body>
<div class="prototype-bar"><span><strong>同步设置</strong> · HTML 交互原型 <span class="desktop-note"> / 仅演示，不连接平台，不保存密钥</span></span><div class="right"><button class="theme" id="themeBtn" aria-label="切换浅色与深色"></button></div></div>
<div class="background-page"><div class="mock-toolbar"><h2>任务列表</h2><button class="button primary" disabled>新建任务</button></div><div class="mock-toolbar"><div class="mock-tabs"><span>全部</span><span>待办</span><span>进行中</span><span>已完成</span></div><span>搜索任务…</span></div><div class="mock-card">整理项目需求与迭代计划</div><div class="mock-card">核对接口文档和权限配置</div><div class="mock-card">完成任务列表的同步设置</div></div>
<div class="backdrop" id="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-label="同步设置">
<header class="head"><div><h1>同步设置</h1><p>连接项目平台，把任务带入 Harness。</p></div><button class="icon-btn" id="close" aria-label="关闭原型弹窗"></button></header>
<nav class="tabs" aria-label="设置页面"><button class="tab active" data-tab="connections"></button><button class="tab" data-tab="rules"></button></nav>
<div class="body" id="body"></div><footer class="footer" id="footer"></footer>
</section></div>
<button class="button primary preview-reopen" id="reopen">重新打开同步设置</button><div class="toast" id="toast" role="status"></div>
<script>
const icons={close:'<path d="m6 6 12 12M18 6 6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',chevron:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m14 5-7 7 7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',link:'<path d="m10 13 4-4M9 15l-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 2 2-2a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/>',moon:'<path d="M20 15a9 9 0 0 1-11-11A9 9 0 1 0 20 15Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',rules:'<path d="M9 6h11M9 12h11M9 18h11M3 6h1M3 12h1M3 18h1"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.info}</svg>`;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);let theme='light',tab='connections',view='list',editIndex=-1,step=1,tested=false,toastTimer;
let connections=[{name:'产品研发 · TAPD',platform:'tapd',id:'20001234',user:'TAPD_USER',password:'TAPD_PASS',enabled:true,tested:true,authMode:'oauth',authorized:true,account:'张小明',appConfigured:true},{name:'工程团队 · 云效',platform:'yunxiao',id:'67f0c1…9a82',token:'YUNXIAO_TOKEN',enabled:false,tested:false,authMode:'oauth',authorized:false}];
let rules=[{name:'产品研发 · 本期任务',connection:'产品研发 · TAPD',project:'产品研发',types:['需求','任务'],assignee:'只分配给我',iteration:'2026 · 第 20 期',workspace:'DeepSeek',enabled:true}];
let connectionDraft={},ruleDraft={};
function button(text,action,primary=false,disabled=false,ico=''){return `<button class="button ${primary?'primary':''}" data-action="${action}" ${disabled?'disabled':''}>${ico?icon(ico):''}${text}</button>`}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2600)}
function setTheme(){document.documentElement.dataset.theme=theme;$('#themeBtn').innerHTML=icon(theme==='light'?'moon':'sun')+(theme==='light'?'深色':'浅色')}
function footer(left,right){$('#footer').innerHTML=`<div class="footer-note">${left}</div><div class="buttons">${right}</div>`}
function draw(){document.querySelectorAll('[data-tab]').forEach(el=>{const active=el.dataset.tab===tab;el.classList.toggle('active',active);el.setAttribute('aria-selected',String(active));el.innerHTML=(el.dataset.tab==='connections'?icon('link')+'连接':icon('rules')+'规则')+`<span class="n">${el.dataset.tab==='connections'?connections.length:rules.length}</span>`});if(tab==='connections'){view==='list'?connectionList():connectionForm()}else{view==='list'?ruleList():ruleForm()}}
function connectionList(){
$('#body').innerHTML=`<div class="section-heading"><div><h2>项目平台连接</h2><p>一个连接可以用于多个项目规则。</p></div>${button('新增连接','new-connection',true,false,'plus')}</div>
${connections.map((c,i)=>`<article class="connection-card"><div class="platform-icon ${c.platform==='yunxiao'?'orange':''}">${c.platform==='tapd'?'T':'云'}</div><div class="connection-info"><strong>${escapeHtml(c.name)}</strong><div class="meta"><span>${c.platform==='tapd'?'TAPD · 公司':'云效 Projex · 组织'} ${escapeHtml(c.id)}</span><span>${c.authorized?'账号 '+escapeHtml(c.account||'张小明')+' · 授权登录':'尚未授权'}</span></div></div><div class="card-right"><span class="status ${!c.enabled?'off':''}">${c.authorized?(c.enabled?'已授权 · 已启用':'已授权 · 未启用'):'待授权'}</span><button class="button small" data-edit-connection="${i}">配置 ${icon('chevron')}</button></div></article>`).join('')}
<div class="empty-hint">${icon('lock')}<div><strong>使用官方授权，不收集登录密码</strong>在平台页面登录并确认授权；已有登录态可减少重复登录。令牌由宿主保存，手动凭据作为备用。</div></div>`;
footer(icon('info')+'所有内容为演示数据',button('关闭','close'));
}
function field(label,name,value,placeholder='',full=false){return `<label class="field" ${full?'style="grid-column:1/-1"':''}><span>${label}</span><input name="${name}" value="${escapeHtml(value)}" placeholder="${placeholder}" autocomplete="off"></label>`}
function authorizationCard(d){
if(d.authMode==='manual')return '';
if(d.authorized)return `<div class="auth-card"><div class="account-row"><span class="avatar">张</span><div><strong>${escapeHtml(d.account||'张小明')}</strong><small>${d.platform==='tapd'?'TAPD':'云效'}账号 · 已授权（模拟）</small></div><span class="status" style="margin-left:auto">已连接</span></div><div class="grid">${selectField(d.platform==='tapd'?'授权项目':'组织','authorizedResource',d.platform==='tapd'?['产品研发（20001234）','客户交付（20005678）']:['工程团队（67f0c1…9a82）','产品团队（890abc…713f）'],d.platform==='tapd'?'产品研发（20001234）':'工程团队（67f0c1…9a82）')}</div><div class="auth-scope">${d.platform==='tapd'?'授权范围：所选项目的需求、任务、缺陷读写，具体以应用权限为准。':'授权令牌权限与当前用户等同，云效目前不支持通过 scope 缩小权限。'}</div><div class="buttons">${button('重新授权','authorize',false,false,'link')}${button('解除连接','disconnect')}</div></div>`;
if(d.platform==='tapd'&&!d.appConfigured)return `<div class="auth-card"><h3>先配置 TAPD 开放应用</h3><p>用户可以用自己的 TAPD 账号授权，但接入方需先创建开放应用并配置回调和 API 权限。身份免登录不等于项目读写授权。</p><div class="buttons">${button('管理员配置','configure-app',true)}${button('使用手动凭据','manual-auth')}</div><p class="permission">本原型尚未接入真实开放应用。配置一次后，其他用户即可从登录授权入口连接。</p>${d.configuringApp?`<div class="app-config"><div class="grid">${field('应用 ID','appId',d.appId||'','TAPD client_id')}${field('应用密钥变量名','appSecretEnv',d.appSecretEnv||'TAPD_CLIENT_SECRET','TAPD_CLIENT_SECRET')}</div><p class="inline-note">应用密钥属于接入方配置，不是用户登录密码。真实密钥只应在受保护的宿主或后端保存。</p><div class="buttons">${button('完成应用配置（演示）','save-app')}</div></div>`:''}</div>`;
return `<div class="auth-card"><h3>用${d.platform==='tapd'?' TAPD':'云效'}账号连接</h3><p>打开官方授权页面，${d.platform==='tapd'?'选择公司和项目，确认应用授权。':'使用已有账号登录并确认授权，无需手动生成 Token。'}如果浏览器已登录，可直接利用当前登录会话。</p><div class="buttons">${button('登录并授权','authorize',true,false,'link')}</div><p class="permission">${d.platform==='tapd'?'已配置开放应用；实际权限取决于安装范围、申请的 API 权限及用户/管理员授权。':'授权码 + PKCE · 客户端可动态注册，无需填写应用密钥。令牌权限与授权用户等同，不支持 scope 限权。'}</p></div>`;
}
function connectionForm(){
const d=connectionDraft;
$('#body').innerHTML=`<div class="form-top"><button class="icon-btn" data-action="back-list" aria-label="返回连接列表">${icon('back')}</button><h2>${editIndex<0?'新增连接':'配置连接'}</h2></div>
<div class="platform-picker">${['tapd','yunxiao'].map(p=>`<button class="platform-option ${d.platform===p?'selected':''}" data-platform="${p}" ${editIndex>=0?'disabled':''}><span class="platform-icon ${p==='yunxiao'?'orange':''}">${p==='tapd'?'T':'云'}</span><span>${p==='tapd'?'TAPD':'云效 Projex'}<small>官方公网${p==='yunxiao'?' · 中心模式':''}</small></span>${d.platform===p?'<span class="checkmark">'+icon('check')+'</span>':''}</button>`).join('')}</div>
<div class="grid">${field('连接名称','name',d.name,'例如：产品研发',true)}</div>
${authorizationCard(d)}
<details class="advanced" ${d.authMode==='manual'?'open':''}><summary>${icon('chevron')}备用方式：手动凭据 <span class="muted" style="font-weight:400">· 可选</span></summary><div class="detail-body"><label class="credential-choice"><input type="checkbox" id="manual-auth" ${d.authMode==='manual'?'checked':''}>使用手动凭据，不走账号授权</label><div class="grid">${field(d.platform==='tapd'?'公司 ID':'组织 ID','id',d.id,d.platform==='tapd'?'例如：20001234':'填写云效组织 ID')}${d.platform==='tapd'?field('API 用户变量名','user',d.user,'TAPD_USER')+field('API 密码变量名','password',d.password,'TAPD_PASS'):field('Token 变量名','token',d.token,'YUNXIAO_TOKEN')}</div><p class="inline-note">填写宿主环境变量名，不填写密钥值。只有勾选此方式后才使用这些字段。</p></div></details>
<div id="test-message">${tested?`<div class="inline-message">${icon('check')}<div>${d.authMode==='manual'?'只读连接测试通过':'账号授权完成'}<span style="display:block;opacity:.8;font-size:11px">仅模拟结果；实际 API 权限仍需验证。</span></div></div>`:''}</div>
${editIndex>=0?`<div class="toggle-row"><div><strong>启用连接</strong><p>${tested?'该连接可供规则使用，保存后生效。':'请先完成连接测试。'}</p></div><button class="switch ${d.enabled?'on':''}" data-action="toggle-connection" role="switch" aria-checked="${d.enabled}" aria-label="启用连接" ${!tested?'disabled':''}><span></span></button></div>`:''}`;
const ready=connectionReady(d);footer(icon('lock')+'仅演示，不执行真实授权或同步',button('取消','back-list')+(d.authMode==='manual'?button('测试连接','test-connection',false,!ready):'')+button(editIndex<0?'保存连接':'保存修改','save-connection',true,!ready));
}
function ruleList(){
$('#body').innerHTML=`<div class="section-heading"><div><h2>同步规则</h2><p>选择项目与导入范围，明确任务如何双向同步。</p></div>${button('新增规则','new-rule',true,false,'plus')}</div>
<div class="table"><div class="table-head"><span>规则 / 项目</span><span class="connection-col">连接</span><span>状态</span><span></span></div>${rules.map((r,i)=>`<div class="table-row"><div><strong>${escapeHtml(r.name)}</strong><small>${escapeHtml(r.project)} · ${r.types.join('、')}</small></div><div class="connection-col muted">${escapeHtml(r.connection)}</div><span class="status ${r.enabled?'':'off'}">${r.enabled?'已启用':'未启用'}</span><button class="button small ghost" data-edit-rule="${i}">编辑</button></div>`).join('')}</div>
<div class="empty-hint">${icon('info')}<div><strong>手动同步，不影响你的本地工作方式</strong>点击任务页的「同步」才会执行所有启用规则。列表筛选不改变同步范围。</div></div>
<div class="callout">双方都改动时，采用远端标题和描述；保留本地整个状态并回写。附件始终留在本地。</div>`;
footer(icon('info')+'新增规则默认停用',button('关闭','close'));
}
function selectField(label,name,options,current){return `<label class="field"><span>${label}</span><select name="${name}">${options.map(o=>`<option ${o===current?'selected':''} value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select></label>`}
function stepHeader(){return `<div class="steps">${['项目与范围','状态映射','确认规则'].map((label,i)=>`${i?'<span class="step-line"></span>':''}<div class="step ${step===i+1?'active':step>i+1?'done':''}"><span class="step-number">${step>i+1?'✓':i+1}</span>${label}</div>`).join('')}</div>`}
function ruleForm(){
const d=ruleDraft;
let content='';
if(step===1){content=`<div class="grid">${field('规则名称','ruleName',d.name,'例如：产品研发 · 本期任务')}${selectField('连接','ruleConnection',connections.map(c=>c.name),d.connection)}${selectField('项目','project',['产品研发','客户交付','基础设施'],d.project)}${selectField('导入工作区','workspace',['DeepSeek','nocobase-ai','不关联工作区'],d.workspace)}</div>
<div class="form-section"><h3>任务类型</h3><div class="chips">${['需求','任务','缺陷'].map(type=>`<button class="chip ${d.types.includes(type)?'checked':''}" data-type="${type}" aria-pressed="${d.types.includes(type)}">${d.types.includes(type)?icon('check'):''}${type}</button>`).join('')}</div></div>
<div class="advanced"><div class="section-heading" style="margin-bottom:12px"><h3 style="font-size:13px;font-weight:550">新任务导入范围<span class="optional-label">可选</span></h3><span class="muted" style="font-size:11px">未限制项导入全部</span></div><div class="filter-grid">${selectField('负责人','assignee',['只分配给我','所有负责人','指定成员…'],d.assignee)}${selectField('迭代','iteration',['2026 · 第 20 期','所有迭代','2026 · 第 19 期'],d.iteration)}${selectField('远端状态','filterStatus',['全部状态','未完成','指定状态…'],d.filterStatus)}</div></div><p class="inline-note">筛选只控制新任务导入，已关联任务仍会同步。</p>`}
if(step===2){content=`<div class="section-heading"><div><h2>状态映射</h2><p>多个远端状态可以对应同一个本地状态，回写目标必须与读取含义一致。</p></div></div><div class="chips" style="margin-bottom:18px">${d.types.map((type,i)=>`<button class="chip ${i===0?'checked':''}" data-map-tab="${type}">${type}</button>`).join('')}</div><div class="mapping-columns"><div><div class="mapping-head"><strong>从远端读取</strong><small>远端 → 本地</small></div><div class="mapping-table"><div class="caption">远端状态</div><div class="caption arrow"></div><div class="caption">本地状态</div>${['未开始','开发中','待验证','已完成'].map((label,i)=>`<div>${label}</div><div class="arrow">→</div><div><select aria-label="读取映射 ${label}">${['待办','进行中','已完成'].map((s,j)=>`<option ${j===[0,1,1,2][i]?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</div></div><div><div class="mapping-head"><strong>回写到远端</strong><small>本地 → 远端</small></div><div class="mapping-table"><div class="caption">本地状态</div><div class="caption arrow"></div><div class="caption">远端目标</div>${['待办','进行中','已完成'].map((label,i)=>`<div><span class="state-pill ${i===1?'blue':i===2?'green':''}">${label}</span></div><div class="arrow">→</div><div><select aria-label="回写映射 ${label}">${['未开始','开发中','已完成'].map((s,j)=>`<option ${i===j?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</div><p class="inline-note">当前远端状态含义一致时，保留原状态，不触发多余流转。</p></div></div><details class="advanced"><summary>${icon('chevron')}可选业务字段 <span class="muted" style="font-weight:400">· 默认仅同步标题、描述和状态</span></summary><div class="detail-body chips"><label class="chip"><input type="checkbox"> 优先级</label><label class="chip"><input type="checkbox"> 标签</label></div></details>`}
if(step===3){content=`<div class="review-box"><h3>${escapeHtml(d.name)}</h3>${[['连接',d.connection],['项目',d.project],['导入工作区',d.workspace],['任务类型',d.types.join('、')],['导入范围',d.assignee+' · '+d.iteration],['同步字段','标题、描述、状态']].map(([k,v])=>`<div class="review-row"><span>${k}</span><span>${escapeHtml(v)}</span></div>`).join('')}</div><div class="conflict-note"><strong>冲突时怎么处理？</strong><br>远端标题与描述优先，本地整个状态优先并回写。<br>工作区、Agent、会话和附件保持本地设置。</div><div class="toggle-row"><div><strong>保存后启用此规则</strong><p>启用不会立即执行。返回任务页，点击「同步」开始。</p></div><button class="switch ${d.enabled?'on':''}" data-action="toggle-rule" role="switch" aria-checked="${d.enabled}" aria-label="保存后启用此规则"><span></span></button></div>`}
$('#body').innerHTML=`<div class="form-top"><button class="icon-btn" data-action="back-list" aria-label="返回规则列表">${icon('back')}</button><h2>${editIndex<0?'新增规则':'编辑规则'}</h2></div>${stepHeader()}${content}`;
footer(icon('info')+(step===3?'保存不会自动开始同步':`第 ${step} 步，共 3 步`),button(step===1?'取消':'上一步',step===1?'back-list':'previous')+button(step===3?'保存规则':'下一步',step===3?'save-rule':'next',true,step===1&&(!d.name.trim()||!d.types.length)));
}
function capture(){if(tab==='connections'&&view==='edit'){['name','id','user','password','token','appId','appSecretEnv'].forEach(n=>{const el=$(`[name="${n}"]`);if(el)connectionDraft[n]=el.value})}if(tab==='rules'&&view==='edit'&&step===1){const mapping={ruleName:'name',ruleConnection:'connection',project:'project',workspace:'workspace',assignee:'assignee',iteration:'iteration',filterStatus:'filterStatus'};Object.entries(mapping).forEach(([n,k])=>{const el=$(`[name="${n}"]`);if(el)ruleDraft[k]=el.value})}}
function changeTab(next){capture();tab=next;view='list';editIndex=-1;draw()}
function connectionReady(d){return Boolean(d.name.trim()&&(d.authMode==='manual'?d.id.trim():d.authorized))}
function openConnection(i=-1){editIndex=i;view='edit';connectionDraft=i<0?{name:'',platform:'yunxiao',id:'',user:'TAPD_USER',password:'TAPD_PASS',token:'YUNXIAO_TOKEN',enabled:false,authMode:'oauth',authorized:false,appConfigured:false}:structuredClone(connections[i]);tested=i>=0&&Boolean(connectionDraft.tested);draw();setTimeout(()=> $('[name="name"]')?.focus(),0)}
function openRule(i=-1){editIndex=i;view='edit';step=1;ruleDraft=i<0?{name:'',connection:connections[0].name,project:'产品研发',types:['需求','任务'],assignee:'只分配给我',iteration:'2026 · 第 20 期',workspace:'DeepSeek',filterStatus:'全部状态',enabled:false}:structuredClone(rules[i]);draw();setTimeout(()=>$('[name="ruleName"]')?.focus(),0)}
function openAuthorization(){
if(connectionDraft.platform==='tapd'&&!connectionDraft.appConfigured){toast('请先配置 TAPD 开放应用');return}
const d=connectionDraft;const layer=document.createElement('div');layer.className='auth-layer';layer.id='auth-layer';
layer.innerHTML=`<section class="auth-dialog" role="dialog" aria-modal="true" aria-label="模拟官方授权"><div class="auth-brand"><span class="platform-icon ${d.platform==='yunxiao'?'orange':''}">${d.platform==='tapd'?'T':'云'}</span><div><strong>${d.platform==='tapd'?'TAPD':'云效'}账号授权</strong><small>官方页面将由外部浏览器打开</small></div><span class="demo-label">模拟</span></div><h2>允许 DSH 任务列表访问？</h2><p>你已登录以下账号。此处模拟现有登录会话，不读取浏览器 Cookie 或登录密码。</p><div class="account-row"><span class="avatar">张</span><div><strong>张小明</strong><small>xiaoming@example.com · 演示账号</small></div></div>${d.platform==='tapd'?`<label class="field" style="margin-top:16px"><span>授权项目</span><select><option>产品研发（20001234）</option><option>客户交付（20005678）</option></select></label>`:''}<div class="auth-permissions"><div>${icon('check')}${d.platform==='tapd'?'访问所选项目的需求、任务、缺陷':'代表当前用户访问云效开放 API'}</div><div>${icon('check')}读取任务，并按规则回写业务字段和状态</div><p style="margin:7px 0 0;font-size:11px">${d.platform==='tapd'?'实际 API 能力以开放应用权限及授权范围为准；身份免登不等于任务权限。':'云效令牌拥有与当前用户等同的资源权限，不支持 scope 缩小范围。'}</p></div><div class="buttons">${button('取消','cancel-auth')}${button('同意授权（演示）','confirm-auth',true)}</div></section>`;
document.body.appendChild(layer);
}
function close(){document.getElementById('auth-layer')?.remove();capture();$('#backdrop').classList.add('closed');$('#reopen').style.display='block';$('#reopen').focus()}
document.addEventListener('click',event=>{
const target=event.target.closest('button');if(!target||target.disabled)return;
if(target.dataset.tab){changeTab(target.dataset.tab);return}
if(target.dataset.editConnection!==undefined){openConnection(Number(target.dataset.editConnection));return}
if(target.dataset.editRule!==undefined){openRule(Number(target.dataset.editRule));return}
if(target.dataset.platform){capture();connectionDraft.platform=target.dataset.platform;connectionDraft.authorized=false;connectionDraft.authMode='oauth';tested=false;draw();return}
if(target.dataset.type){capture();const t=target.dataset.type;ruleDraft.types=ruleDraft.types.includes(t)?ruleDraft.types.filter(x=>x!==t):[...ruleDraft.types,t];draw();return}
if(target.dataset.mapTab){document.querySelectorAll('[data-map-tab]').forEach(b=>b.classList.toggle('checked',b===target));return}
const a=target.dataset.action;capture();
if(a==='authorize')openAuthorization();
if(a==='cancel-auth')document.getElementById('auth-layer')?.remove();
if(a==='confirm-auth'){document.getElementById('auth-layer')?.remove();connectionDraft.authorized=true;connectionDraft.account='张小明';connectionDraft.id=connectionDraft.platform==='tapd'?'20001234':'67f0c1…9a82';tested=true;draw();toast('模拟授权完成 · 未发送真实请求')}
if(a==='disconnect'){connectionDraft.authorized=false;connectionDraft.enabled=false;tested=false;draw();toast('已解除模拟连接')}
if(a==='configure-app'){connectionDraft.configuringApp=true;draw()}
if(a==='save-app'){connectionDraft.appConfigured=true;connectionDraft.configuringApp=false;draw();toast('开放应用已配置（模拟），可继续账号授权')}
if(a==='manual-auth'){connectionDraft.authMode='manual';draw()}
if(a==='new-connection')openConnection();
if(a==='new-rule')openRule();
if(a==='back-list'){view='list';draw()}
if(a==='test-connection'){target.disabled=true;target.textContent='正在测试…';setTimeout(()=>{tested=true;draw();toast('模拟测试通过 · 未发送真实请求')},650)}
if(a==='save-connection'){connectionDraft.tested=tested;if(editIndex<0)connections.push({...connectionDraft});else connections[editIndex]={...connectionDraft};view='list';draw();toast('连接已保存（仅原型演示）')}
if(a==='toggle-connection'){connectionDraft.enabled=!connectionDraft.enabled;draw()}
if(a==='next'){step=Math.min(3,step+1);draw();$('#body').scrollTop=0}
if(a==='previous'){step=Math.max(1,step-1);draw();$('#body').scrollTop=0}
if(a==='toggle-rule'){ruleDraft.enabled=!ruleDraft.enabled;draw()}
if(a==='save-rule'){if(editIndex<0)rules.push(structuredClone(ruleDraft));else rules[editIndex]=structuredClone(ruleDraft);view='list';draw();toast('规则已保存 · 未开始同步（演示）')}
if(a==='close')close();
});
document.addEventListener('input',event=>{if(!event.target.matches('input,select'))return;capture();if(tab==='connections'){const ready=connectionReady(connectionDraft);document.querySelectorAll('[data-action="save-connection"],[data-action="test-connection"]').forEach(b=>b.disabled=!ready)}else if(step===1){const b=$('[data-action="next"]');if(b)b.disabled=!ruleDraft.name.trim()||!ruleDraft.types.length}});
document.addEventListener('change',event=>{if(event.target.id==='manual-auth'){capture();connectionDraft.authMode=event.target.checked?'manual':'oauth';draw()}});
$('#themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';setTheme()};$('#close').onclick=close;$('#reopen').onclick=()=>{$('#backdrop').classList.remove('closed');$('#reopen').style.display='none';view='list';draw()};document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('auth-layer'))document.getElementById('auth-layer').remove();else close()}});
setTheme();draw();
</script>
</body>
</html>
